<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-Star Super League Center - Mobile Optimized</title>
    <style>
        /* 기본 테마: 다크 모드 */
        body { background-color: #050505; color: white; font-family: 'Malgun Gothic', sans-serif; margin: 0; text-align: center; }
        
        /* 상단 헤더 디자인 */
        .header { padding: 50px 20px; background: linear-gradient(to bottom, #1a1a1a, #050505); border-bottom: 2px solid #d4af37; }
        h1 { color: #d4af37; font-size: 2.5rem; margin: 0; text-shadow: 0 0 15px rgba(212,175,55,0.6); }
        p { color: #aaa; margin: 10px 0 0 0; }

        /* [핵심 수정] 이미지들을 1열 세로로 나열하는 컨테이너 설정 */
        .container {
            display: flex;
            flex-direction: column; /* 무조건 세로 방향으로 나열 */
            align-items: center;    /* 가운데 정렬 */
            gap: 30px;              /* 카드 사이 간격 */
            padding: 30px 20px;
            max-width: 900px;       /* 한 열일 때 가독성을 위해 너비 제한 */
            margin: 0 auto;
        }

        /* [핵심 수정] 카드를 가로로 가득 차게 설정 */
        .card {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            overflow: hidden;
            width: 100%;            /* 부모 컨테이너(max-width: 900px) 너비를 다 씁니다 */
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        /* 카드 호버 효과 */
        .card:hover { transform: translateY(-5px); border-color: #d4af37; }

        /* 카드 제목 설정 */
        .card h2 { font-size: 1.2rem; padding: 15px; margin: 0; background: #1a1a1a; color: #d4af37; border-bottom: 1px solid #333; }
        
        /* [핵심 수정] 이미지 설정 - 가로 100%, 세로 자동 */
        .card img {
            width: 100%;            /* 카드의 가로 크기에 무조건 맞춤 */
            height: auto;           /* 세로 비율은 원본 유지 */
            display: block;
            min-height: 100px;     /* 이미지가 없을 때 최소 높이 */
            background-color: #000; /* 로딩 전 배경 */
        }

        /* 하단 정보 */
        footer { padding: 50px 20px; color: #555; border-top: 1px solid #1a1a1a; margin-top: 50px; }
        #time { color: #888; font-weight: bold; }

        /* 모바일용 폰트 크기 조정 */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .card h2 { font-size: 1rem; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ALL-STAR SUPER LEAGUE</h1>
        <p>⚽ 실시간 리그 데이터 통합 대시보드</p>
    </div>
    
    <div class="container">
        <div class="card"><h2>🥇 1부 리그 순위표</h2><img src="https://i.ibb.co/YTkD60TY/2346998dc77b.jpg" alt="1부 리그"></div>
        <div class="card"><h2>🥈 2부 리그 순위표</h2><img src="https://i.ibb.co/kVWW7dVy/b74bfbfd9901.jpg" alt="2부 리그"></div>
        <div class="card"><h2>🌟 UCL 그룹스테이지</h2><img src="https://i.ibb.co/Qv44R86P/cd825f94ffd6.jpg" alt="UCL 조별"></div>
        <div class="card"><h2>🏆 UCL 토너먼트 대진표</h2><img src="https://i.ibb.co/1G2R16t8/047e6a6cbb3a.jpg" alt="UCL 토너"></div>
        <div class="card"><h2>🎖 UEL 토너먼트 대진표</h2><img src="https://i.ibb.co/wN8KyFYq/2c7024a73db1.jpg" alt="UEL 토너"></div>
        <div class="card"><h2>🏅 FA컵 토너먼트 대진표</h2><img src="https://i.ibb.co/Tqw7zCC2/eb76ae18e50d.jpg" alt="FA컵"></div>
        <div class="card"><h2>👑 GOLDEN BOOT (통합 득점왕)</h2><img src="https://i.ibb.co/DDfvKjtS/d0f45067e6ef.jpg" alt="득점왕"></div>
    </div>
    
    <footer>
        © 2026 All-Star Super League Center | 마지막 업데이트: <span id="time"></span>
    </footer>
    
    <script>document.getElementById('time').innerText = new Date().toLocaleString();</script>
</body>
</html>
